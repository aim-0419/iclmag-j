name: Deploy to EC2

# ====================================
# 자동 배포 설정
# ------------------------------------
# main 브랜치에 코드가 올라가면 EC2 서버에 자동으로 반영합니다.
#
# 접속 정보(주소·계정·열쇠)는 코드에 적지 않고
# GitHub 저장소의 Settings > Secrets and variables > Actions 에 보관합니다.
# 그래야 소스코드가 공개되어도 서버 접속 정보가 새지 않습니다.
# ====================================

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into EC2 and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            # set -e : 중간에 한 단계라도 실패하면 즉시 멈춥니다.
            # 이렇게 하지 않으면 빌드가 실패했는데도 서버를 다시 시작해서
            # 망가진 상태가 실제 사이트에 반영될 수 있습니다.
            set -e

            cd /home/ubuntu/iclmag_j
            git pull origin main
            npm ci || npm install

            # Prisma 관련 코드 생성
            npx prisma generate

            # 데이터베이스 구조를 최신 상태로 맞춥니다.
            #
            # 왜 필요한가요?
            # 예전에 비밀번호 재설정 기능을 추가하면서 코드에는 표(테이블) 정의를 넣었는데
            # 서버 데이터베이스에는 실제로 만들지 않아, 비밀번호 찾기가 동작하지 않는
            # 상태로 방치된 적이 있습니다. 이 단계가 그런 일을 막아 줍니다.
            #
            # --accept-data-loss 를 일부러 쓰지 않습니다.
            # 기존 데이터가 지워질 수 있는 변경이라면 여기서 배포가 멈추고,
            # 사람이 직접 확인한 뒤에 진행하게 됩니다. (위에서 set -e 를 켰기 때문)
            npx prisma db push

            npm run build

            # 여기까지 문제없이 끝났을 때만 서버를 교체합니다.
            pm2 restart iclmag-j
            echo "배포 완료"
